name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints.txt

      # A checkout that rewrote LF to CRLF changes the SHA-256 of the hash-locked
      # DTM edge patch, and `hydromind data rebuild` then refuses to start with no
      # hint about why. Check it before installing anything, so the failure names
      # its own cause instead of surfacing later as a data-build error.
      - name: Checkout is byte-exact
        run: python scripts/check_checkout.py

      # Whether a runner image enables core.autocrlf is outside this repository's
      # control, so do not let a green job depend on it. Force the hostile setting,
      # re-materialise the file, and require .gitattributes to hold the line. A
      # plain `git checkout` skips files that did not change, hence the delete.
      - name: .gitattributes survives core.autocrlf=true
        shell: bash
        run: |
          echo "runner: $(git config --show-origin --get core.autocrlf || echo 'core.autocrlf unset')"
          rm -f data/glasgow-dtm-edge-patch.csv
          git -c core.autocrlf=true checkout -- data/glasgow-dtm-edge-patch.csv
          python scripts/check_checkout.py

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints.txt

      # Global plugin autoload is disabled so unrelated system pytest plugins
      # cannot break collection, matching the documented local command.
      - name: Tests
        env:
          HYDROMIND_MODEL: test
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -p pytest_asyncio.plugin

      - name: CLI runs
        env:
          HYDROMIND_MODEL: test
        run: hydromind doctor

      # No credentials and no 8.8 GB download here: this only proves the licence
      # and input-file gate reports what a fresh clone is still missing.
      - name: Data preflight reports what is missing
        env:
          HYDROMIND_MODEL: test
        run: hydromind data preflight

  constraints:
    name: constraints.txt is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints.txt
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: python scripts/write_constraints.py --check
