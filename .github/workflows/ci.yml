name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints.txt

      # Windows runners ship Git with core.autocrlf=true. Without the repository
      # .gitattributes this rewrites LF to CRLF on checkout, which changes the
      # SHA-256 of the hash-locked DTM edge patch and makes `hydromind data
      # rebuild` refuse to start. Check it before anything else, so the failure
      # names its own cause instead of surfacing later as a data-build error.
      - name: Checkout is byte-exact
        shell: python
        run: |
          import hashlib, json, pathlib, sys

          lock = json.loads(pathlib.Path("data/glasgow-5m-sources.json").read_text(encoding="utf-8"))
          patch = lock["legacy_edge_patch"]
          raw = pathlib.Path(patch["path"]).read_bytes()
          actual = hashlib.sha256(raw).hexdigest()
          if actual == patch["sha256"]:
              print(f"{patch['path']}: {len(raw)} bytes, sha256 matches the source lock.")
              sys.exit(0)
          if b"\r\n" in raw:
              print("::error::Checkout rewrote LF to CRLF; .gitattributes is missing or not honoured.")
          print(f"::error::{patch['path']} expected sha256 {patch['sha256']} ({patch['bytes']} bytes), "
                f"got {actual} ({len(raw)} bytes)")
          sys.exit(1)

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints.txt

      # Global plugin autoload is disabled so unrelated system pytest plugins
      # cannot break collection, matching the documented local command.
      - name: Tests
        env:
          HYDROMIND_MODEL: test
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -p pytest_asyncio.plugin

      - name: CLI runs
        env:
          HYDROMIND_MODEL: test
        run: hydromind doctor

      # No credentials and no 8.8 GB download here: this only proves the licence
      # and input-file gate reports what a fresh clone is still missing.
      - name: Data preflight reports what is missing
        env:
          HYDROMIND_MODEL: test
        run: hydromind data preflight

  constraints:
    name: constraints.txt is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints.txt
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: python scripts/write_constraints.py --check
