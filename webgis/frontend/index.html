<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Hydromind Flood Risk Assessment System</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./demo.css?v=20260831-report-layout" />
  </head>
  <body>
    <div id="demo-map"></div>

    <header class="app-bar">
      <div class="app-mark" aria-hidden="true">O</div>
      <div>
        <h1>OASIS GeoAgent</h1>
        <p>Glasgow flood intelligence</p>
      </div>
    </header>

    <aside class="action-bar" aria-label="Map layer controls">
      <button class="action-button" id="risk-overlay-btn" type="button">
        <span>Layer</span>
        <strong>Latest Hazard</strong>
      </button>
      <div id="analysis-layer-list" class="analysis-layer-list" aria-label="Analysis result layers"></div>
    </aside>

    <button
      id="agent-open-btn"
      class="agent-open-button"
      type="button"
      aria-controls="agent-panel"
      aria-expanded="false"
    >
      <span aria-hidden="true">‹</span>
    </button>

    <section id="agent-panel" class="agent-panel" aria-label="Map conversation">
      <div
        id="agent-resizer"
        class="agent-resizer"
        role="separator"
        aria-label="Resize Agent panel"
        aria-orientation="vertical"
        aria-valuemin="320"
        aria-valuemax="720"
        title="Drag to resize the Agent panel"
        tabindex="0"
      ></div>
      <header class="conversation-header">
        <div class="panel-tabs" role="tablist" aria-label="Result views">
          <button
            id="conversation-tab"
            class="panel-tab active"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="conversation-view"
          >Conversation</button>
          <button
            id="risk-report-tab"
            class="panel-tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="risk-report-view"
            disabled
          >Risk report<span class="report-ready-dot" aria-hidden="true"></span></button>
        </div>
        <button
          id="agent-collapse-btn"
          class="agent-collapse-button"
          type="button"
          aria-label="Collapse conversation panel"
          title="Collapse panel"
        >
          ›
        </button>
      </header>

      <div id="conversation-view" class="conversation-view" role="tabpanel" aria-labelledby="conversation-tab">
        <div id="agent-history" class="agent-history"></div>

        <div class="prompt-row">
          <button class="prompt-chip" type="button" data-prompt="Refresh and show the current flood risk of G2 8JB">Current risk at G2 8JB</button>
          <button class="prompt-chip" type="button" data-prompt="What is the flood risk across Glasgow for the next 24 hours?">Next 24 hours</button>
          <button class="prompt-chip" type="button" data-prompt="Compare lower flood-risk driving routes from Glasgow Central Station to the University of Glasgow">Compare A→B routes</button>
          <button class="prompt-chip" type="button" data-prompt="Find railway stations within 2 km with a higher flood hazard class than this location">Nearby higher-risk stations</button>
          <button class="prompt-chip" type="button" data-prompt="Only show the higher-risk places">Keep higher risk</button>
          <button class="prompt-chip" type="button" data-prompt="Explain the evidence for the highest one">Explain</button>
        </div>

        <form id="agent-form" class="agent-form">
          <input
            id="agent-input"
            type="text"
            autocomplete="off"
            placeholder="Ask about a place, compare routes, or control the map…"
            aria-label="Ask the map agent to locate a postcode or place"
          />
          <button type="submit">Send</button>
        </form>
      </div>

      <section
        id="risk-report-view"
        class="risk-report-view"
        role="tabpanel"
        aria-labelledby="risk-report-tab"
        hidden
      ></section>
    </section>

    <aside id="legend-card" class="legend-card" aria-label="Hazard legend">
      <h3 id="legend-title">Latest calculated hazard · 5 m</h3>
      <div id="legend-high-row" class="legend-row"><span id="legend-high-swatch" class="risk high"></span>High · class 3</div>
      <div id="legend-medium-row" class="legend-row"><span id="legend-medium-swatch" class="risk medium"></span>Medium · class 2</div>
      <div id="legend-low-row" class="legend-row"><span id="legend-low-swatch" class="risk low"></span>Low · class 1</div>
      <p class="legend-subtitle">Candidate routes</p>
      <div class="legend-row"><span class="route-line best"></span>Lower calculated-hazard exposure</div>
      <div class="legend-row"><span class="route-line alternative"></span>Alternative</div>
      <p id="legend-note" class="legend-note">Latest SEPA-rainfall prototype snapshot. Not an operational flood warning.</p>
    </aside>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./config.local.js?v=20260830-carto-key"></script>
    <script src="./demo.js?v=20260831-priority-assessment"></script>
  </body>
</html>
