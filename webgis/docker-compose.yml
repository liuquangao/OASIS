services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: glasgow-postgis
    environment:
      POSTGRES_DB: glasgow_flood
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: gis_password
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./backend/postgis/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis -d glasgow_flood"]
      interval: 10s
      timeout: 5s
      retries: 10

  geoserver:
    image: docker.osgeo.org/geoserver:2.28.2
    container_name: glasgow-geoserver
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
      GEOSERVER_DATA_DIR: /opt/geoserver_data
      CORS_ENABLED: "true"
      EXTRA_JAVA_OPTS: "-Xms512m -Xmx1g"
    ports:
      - "8080:8080"
    volumes:
      - geoserver_data:/opt/geoserver_data
      - ./data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-180}
    container_name: glasgow-fastapi
    depends_on:
      postgis:
        condition: service_healthy
      geoserver:
        condition: service_started
    environment:
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      POSTGRES_DB: glasgow_flood
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: gis_password
      METADATA_PATH: /app/data/metadata/datasets.json
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro

volumes:
  postgis_data:
  geoserver_data:
