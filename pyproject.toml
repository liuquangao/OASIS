[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oasis-geoagent"
version = "0.1.0"
description = "GeoAI agent for live observations, WebGIS interaction, and deterministic flood-risk analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-ai>=2.22,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-dotenv>=1.0,<2",
  "rasterio>=1.4,<1.5",
  "numpy>=2,<3",
  "PyYAML>=6,<7",
  "shapely>=2,<3",
  "scikit-learn>=1.4,<2",
  "openpyxl>=3.1,<4",
  "matplotlib>=3.8,<4",
  "pyshp>=2.3,<3",
  "pysheds>=0.5,<0.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[project.scripts]
oasis = "oasis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oasis", "src/core_analyst"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
